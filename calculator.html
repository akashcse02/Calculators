<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculators</title>
    <link rel="stylesheet" href="./Styles/style.css">
</head>
    <header>
        <h1>Calculators AM</h1>
        
        <nav>
            <ul>
                <img src="./images/logo.png" width="50px" height="50px" alt="Logo">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./calculator.html"> Simple Calculator</a></li>
                <li><a href="./bmi.html"> Grade Calculator</a></li>
                <li><a href="./tip.html">Tip Calculator</a></li>
                <li><a href="./loan.html">About</a></li>
            </ul>
        </nav>
    </header>

<body>
    <section>
        <div class="Simple-calculator">
        <h2><img src="./images/calculator.png" width="25px" height="25px" alt="Calculator">Simple Calculator</h2>
            <div>
             <div class="box">
                <input type="text" id="a" placeholder="Enter first number">

                <select id="op"> 
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
                <input type="text" id="b" placeholder="Enter second number">
                <button id="calculate">Calculate</button>
            <section class="result">
            <input
                type="text"
                id="result"
                placeholder="Result will be shown here"
                readonly>
        </section>
       
            </div>
        </div>
    </section>

    <section>
        <div class="Grade-calculator">
            <h2><img src="./images/grade.png" width="25px" height="25px" alt="Grade">Grade Calculator</h2>
            <div class="box">
                <input type="text" id="marks" placeholder="Enter your marks">
                <button id="calculate-grade">Calculate Grade</button>
                <section class="result">
                    <input
                        type="text"
                        id="grade-result"
                        placeholder="Your grade will be shown here"
                        readonly>
                </section>
            </div>
        </div>
     <script src="./script.js"></script>

</body>
</html>
